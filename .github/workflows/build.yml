---
name: Build

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  GO_VER: 1.26.3
  PROTOC_VER: "33.1"
  PROTOC_GEN_GO_VER: v1.36.10

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VER }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VER }}

      - name: check go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: check vendor
        run: |
          go mod vendor
          git diff --exit-code

      # The key is always emitted, so its absence means the format changed.
      - name: reject replace directives
        run: |
          modjson="$(go mod edit -json)"
          if ! grep -q '"Replace":' <<<"$modjson"; then
            echo "::error::no Replace key in go mod output; check is broken"
            exit 1
          fi
          if ! grep -q '"Replace": null' <<<"$modjson"; then
            echo "::error::replace is not permitted; pin by version or commit"
            sed -n '/"Replace": \[/,/^\t\],$/p' <<<"$modjson"
            exit 1
          fi

      - name: go.work must not be tracked
        run: |
          if git ls-files --error-unmatch go.work >/dev/null 2>&1; then
            echo "::error::go.work is tracked; it is local-iteration-only"
            exit 1
          fi

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # depguard cannot tell a legitimate protobuf import from one whose output
      # is hashed; this analyzer resolves calls through the type checker.
      # Built from a pinned checkout: the module proxy and checksum database
      # both lag on nested-module tags, and CI should not wait on them.
      - name: determinism analyzer
        run: |
          git clone --depth 1 --branch lint/v0.3.0 \
            https://github.com/SmartBFT-Go/canonical.git /tmp/canonical
          (cd /tmp/canonical/lint && go build -o /tmp/detcheck ./cmd/detcheck)
          go vet -vettool=/tmp/detcheck ./...

      - name: go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          files=$(find . -name '*.go' | grep -v vendor | grep -v 'pb.go')
          goimports -l -w $files
          git diff --exit-code

      - name: check protobuf
        run: |
          pkg=google.golang.org/protobuf/cmd/protoc-gen-go
          go install $pkg@${{ env.PROTOC_GEN_GO_VER }}
          protoc --go_opt=paths=source_relative \
            --go_out=. smartbftprotos/*.proto
          protoc --go_opt=paths=source_relative \
            --go_out=. examples/naive_chain/*.proto
          protoc --go_opt=paths=source_relative \
            --go_out=. test/*.proto
          git diff --exit-code

  build:
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VER }}

      - name: Test
        run: |
          go test -count 1 -race ./...
